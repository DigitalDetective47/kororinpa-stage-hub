{% extends "kororinpa_stage_hub/base.html" %}
{% block title %}Confirm Deletion of {{ submission.name }}{% endblock %}
{% block inner %}
<h1 style="text-align:center;">Confirm Deletion of {{ submission.name }}</h1>
<p>Are you sure you want to delete this stage? This action is irreversible.</p>
<form action="{% url "kororinpa_stage_hub:stage/delete" submission.id %}" method="post">
    {% csrf_token %}
    <input type="submit" value="Yes" />
    <input type="button" onclick="window.location.href='{{ submission.get_absolute_url }}';" value="No" />
</form>
{% endblock %}
